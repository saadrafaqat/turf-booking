<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CricTurf Admin Panel</title>
<link rel="stylesheet" href="../css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { padding: 80px 20px 40px; }
.admin-login { max-width: 420px; margin: 60px auto; padding: 35px; border-radius: 20px; }
.admin-login h2 { text-align: center; margin-bottom: 8px; font-size: 1.6rem; color: white; }
.admin-login p { text-align: center; color: rgba(255,255,255,0.6); font-size: 0.85rem; margin-bottom: 25px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; color: rgba(255,255,255,0.7); font-size: 0.82rem; margin-bottom: 6px; }
.admin-input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; color: white; font-family: 'Inter'; font-size: 0.95rem; box-sizing: border-box; }
.admin-input:focus { outline: none; border-color: #6c5ce7; }
.login-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; border: none; border-radius: 12px; font-family: 'Inter'; font-size: 1rem; font-weight: 600; cursor: pointer; }
.login-error { display: none; background: rgba(225,112,85,0.15); border: 1px solid rgba(225,112,85,0.3); color: #e17055; padding: 10px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px; text-align: center; }
.login-error.show { display: block; }
.admin-header { text-align: center; margin-bottom: 30px; }
.admin-header h1 { font-size: 2rem; color: white; }
.admin-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; max-width: 900px; margin-left: auto; margin-right: auto; }
.logout-btn { padding: 8px 18px; background: rgba(225,112,85,0.15); color: #e17055; border: 1px solid rgba(225,112,85,0.3); border-radius: 10px; font-family: 'Inter'; font-weight: 600; cursor: pointer; }
.bookings-container { max-width: 900px; margin: 0 auto; }
.booking-card { padding: 20px; border-radius: 16px; margin-bottom: 15px; border-left: 4px solid #fdcb6e; }
.booking-card.confirmed { border-left-color: #00b894; }
.booking-card.rejected { border-left-color: #e17055; }
.booking-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.booking-id { font-family: monospace; font-size: 1rem; color: #a29bfe; font-weight: 700; }
.booking-status { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
.booking-status.pending { background: rgba(253,203,110,0.2); color: #fdcb6e; }
.booking-status.confirmed { background: rgba(0,184,148,0.2); color: #00b894; }
.booking-status.rejected { background: rgba(225,112,85,0.2); color: #e17055; }
.booking-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
.detail-row { font-size: 0.85rem; color: white; }
.detail-row .label { color: rgba(255,255,255,0.6); display: block; font-size: 0.72rem; }
.detail-row .value { font-weight: 600; }
.amount-match { padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; }
.amount-match.match { background: rgba(0,184,148,0.15); color: #00b894; }
.amount-match.mismatch { background: rgba(225,112,85,0.15); color: #e17055; }
.booking-actions { display: flex; gap: 10px; }
.confirm-btn { flex: 1; padding: 10px; background: linear-gradient(135deg, #00b894, #00d4a8); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
.reject-btn { flex: 1; padding: 10px; background: rgba(225,112,85,0.2); color: #e17055; border: 1px solid rgba(225,112,85,0.3); border-radius: 10px; font-weight: 600; cursor: pointer; }
.no-bookings { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.6); }
.no-bookings i { font-size: 3rem; margin-bottom: 15px; display: block; }
.refresh-btn { display: flex; align-items: center; gap: 8px; margin: 0 auto 20px; padding: 10px 24px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: white; border-radius: 12px; font-weight: 600; cursor: pointer; }
.stats-bar { display: flex; gap: 15px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
.stat-box { padding: 15px 25px; border-radius: 12px; text-align: center; }
.stat-box .num { font-size: 1.8rem; font-weight: 800; display: block; }
.stat-box .lbl { font-size: 0.75rem; color: rgba(255,255,255,0.6); }
.pending-stat .num { color: #fdcb6e; }
.confirmed-stat .num { color: #00b894; }
.rejected-stat .num { color: #e17055; }
.hidden { display: none !important; }
.gradient-text { background: linear-gradient(135deg, #6c5ce7, #a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
@media(max-width:600px) { .booking-details { grid-template-columns: 1fr; } .booking-actions { flex-direction: column; } }
</style>
</head>
<body>

<div class="bg-animation">
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>
</div>

<nav class="navbar glass-effect">
    <div class="nav-brand"><span>🏏</span><span>CricTurf Admin</span></div>
    <div class="nav-links"><a href="../index.html" class="nav-link">← Back to Site</a></div>
</nav>

<!-- LOGIN -->
<div class="admin-login glass-effect" id="admin-login">
    <h2>🔐 Admin Login</h2>
    <p>Authorized personnel only</p>
    <div class="login-error" id="login-error">Invalid credentials</div>
    <div class="form-group">
        <label>Username</label>
        <input type="text" id="admin-username" class="admin-input" placeholder="Username">
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="admin-password" class="admin-input" placeholder="Password">
    </div>
    <button class="login-btn" id="login-btn"><i class="fas fa-sign-in-alt"></i> Login</button>
</div>

<!-- DASHBOARD -->
<div class="bookings-container hidden" id="admin-dashboard">
    <div class="admin-topbar">
        <div>
            <h1 style="color:white;font-size:1.6rem;margin:0;">🏏 Payment <span class="gradient-text">Verification</span></h1>
        </div>
        <button class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <div class="stats-bar">
        <div class="stat-box pending-stat glass-effect-dark"><span class="num" id="stat-pending">0</span><span class="lbl">Pending</span></div>
        <div class="stat-box confirmed-stat glass-effect-dark"><span class="num" id="stat-confirmed">0</span><span class="lbl">Confirmed</span></div>
        <div class="stat-box rejected-stat glass-effect-dark"><span class="num" id="stat-rejected">0</span><span class="lbl">Rejected</span></div>
    </div>

    <button class="refresh-btn" id="refresh-btn"><i class="fas fa-sync-alt"></i> Refresh</button>
    <div id="bookings-list"></div>
</div>

<script>
const ADMIN_USERNAME = 'admin';
const ADMIN_PASSWORD = 'cricturf2024';

document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('admin-password').addEventListener('keypress', e => { if(e.key==='Enter') login(); });
document.getElementById('admin-username').addEventListener('keypress', e => { if(e.key==='Enter') login(); });

function login() {
    const u = document.getElementById('admin-username').value.trim();
    const p = document.getElementById('admin-password').value;
    const err = document.getElementById('login-error');

    if (u === ADMIN_USERNAME && p === ADMIN_PASSWORD) {
        sessionStorage.setItem('adminLogged', 'true');
        document.getElementById('admin-login').classList.add('hidden');
        document.getElementById('admin-dashboard').classList.remove('hidden');
        loadBookings();
    } else {
        err.textContent = 'Invalid username or password';
        err.classList.add('show');
    }
}

document.getElementById('logout-btn').addEventListener('click', () => {
    sessionStorage.removeItem('adminLogged');
    location.reload();
});

document.getElementById('refresh-btn').addEventListener('click', loadBookings);

if (sessionStorage.getItem('adminLogged') === 'true') {
    document.getElementById('admin-login').classList.add('hidden');
    document.getElementById('admin-dashboard').classList.remove('hidden');
    loadBookings();
}

async function loadBookings() {
    const list = document.getElementById('bookings-list');
    list.innerHTML = '<div class="no-bookings"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>';

    try {
        const res = await fetch('/api/get-bookings');
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); }
        catch { throw new Error('API returned invalid response. Check Cloudflare Functions setup.'); }

        document.getElementById('stat-pending').textContent = data.pending || 0;
        document.getElementById('stat-confirmed').textContent = data.confirmed || 0;
        document.getElementById('stat-rejected').textContent = data.rejected || 0;

        if (!data.bookings || !data.bookings.length) {
            list.innerHTML = '<div class="no-bookings"><i class="fas fa-inbox"></i><p>No bookings yet</p></div>';
            return;
        }

        list.innerHTML = data.bookings.map(b => {
            const match = parseInt(b.paidAmount) === parseInt(b.expectedAmount);
            const status = b.status || 'pending';
            return `
            <div class="booking-card glass-effect ${status}">
                <div class="booking-header">
                    <span class="booking-id">${b.bookingId}</span>
                    <span class="booking-status ${status}">${status.toUpperCase()}</span>
                </div>
                <div class="booking-details">
                    <div class="detail-row"><span class="label">Name</span><span class="value">${b.userDetails?.fullName||'-'}</span></div>
                    <div class="detail-row"><span class="label">Phone</span><span class="value">${b.userDetails?.phone||'-'}</span></div>
                    <div class="detail-row"><span class="label">Email</span><span class="value">${b.userDetails?.email||'-'}</span></div>
                    <div class="detail-row"><span class="label">Team</span><span class="value">${b.userDetails?.teamName||'N/A'}</span></div>
                    <div class="detail-row"><span class="label">Turf</span><span class="value">Turf ${b.turfNumber}</span></div>
                    <div class="detail-row"><span class="label">Date</span><span class="value">${b.date}</span></div>
                    <div class="detail-row"><span class="label">Slot</span><span class="value">${b.time}</span></div>
                    <div class="detail-row"><span class="label">Players</span><span class="value">${b.userDetails?.players||'-'}</span></div>
                    <div class="detail-row"><span class="label">Method</span><span class="value">${b.paymentMethod||'-'}</span></div>
                    <div class="detail-row"><span class="label">TXN ID</span><span class="value" style="font-family:monospace">${b.transactionId||'-'}</span></div>
                    <div class="detail-row"><span class="label">Sender</span><span class="value">${b.senderNumber||'-'}</span></div>
                    <div class="detail-row"><span class="label">Submitted</span><span class="value">${new Date(b.submittedAt).toLocaleString()}</span></div>
                </div>
                <div class="amount-match ${match?'match':'mismatch'}">
                    ${match ? `<i class="fas fa-check-circle"></i> AMOUNT MATCH: ₨${b.paidAmount} = ₨${b.expectedAmount}` : `<i class="fas fa-times-circle"></i> MISMATCH: Sent ₨${b.paidAmount} ≠ Expected ₨${b.expectedAmount}`}
                </div>
                ${status === 'pending' ? `
                <div class="booking-actions">
                    <button class="confirm-btn" onclick="verifyBooking('${b.bookingId}','confirmed')"><i class="fas fa-check"></i> Confirm</button>
                    <button class="reject-btn" onclick="verifyBooking('${b.bookingId}','rejected')"><i class="fas fa-times"></i> Reject</button>
                </div>` : `<p style="color:rgba(255,255,255,0.5);font-size:0.8rem;font-style:italic;">Already ${status}</p>`}
            </div>`;
        }).join('');

    } catch (err) {
        list.innerHTML = `<div class="no-bookings"><i class="fas fa-exclamation-triangle"></i><p>Error: ${err.message}</p></div>`;
    }
}

async function verifyBooking(bookingId, action) {
    if (!confirm(`${action.toUpperCase()} booking ${bookingId}?`)) return;
    try {
        const res = await fetch('/api/verify-booking', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bookingId, action })
        });
        const data = await res.json();
        if (data.success) {
            alert(`Booking ${action}!`);
            loadBookings();
        } else {
            alert('Error: ' + data.error);
        }
    } catch (e) {
        alert('Error: ' + e.message);
    }
}

setInterval(() => {
    if (!document.getElementById('admin-dashboard').classList.contains('hidden')) loadBookings();
}, 30000);
</script>

</body>
</html>
