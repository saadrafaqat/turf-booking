<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CricTurf Admin - Payment Verification</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding: 80px 20px 40px; }
        .admin-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .admin-header h1 {
            font-size: 2rem;
            font-weight: 800;
        }
        .admin-header p {
            color: var(--text-secondary);
        }
        .admin-login {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            border-radius: 20px;
        }
        .admin-login h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .admin-login .form-group {
            margin-bottom: 15px;
        }
        .admin-login input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: white;
            font-family: 'Inter';
            font-size: 0.95rem;
            outline: none;
        }
        .admin-login input:focus {
            border-color: var(--primary);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--gradient-1);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Inter';
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .pending-bookings {
            max-width: 900px;
            margin: 0 auto;
        }
        .booking-card {
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
            border-left: 4px solid var(--warning);
        }
        .booking-card.confirmed {
            border-left-color: var(--success);
        }
        .booking-card.rejected {
            border-left-color: var(--danger);
        }
        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .booking-id {
            font-family: monospace;
            font-size: 1rem;
            color: var(--primary-light);
            font-weight: 700;
        }
        .booking-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .booking-status.pending {
            background: rgba(253,203,110,0.2);
            color: var(--warning);
        }
        .booking-status.confirmed {
            background: rgba(0,184,148,0.2);
            color: var(--success);
        }
        .booking-status.rejected {
            background: rgba(225,112,85,0.2);
            color: var(--danger);
        }
        .booking-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        .booking-detail {
            font-size: 0.85rem;
        }
        .booking-detail .label {
            color: var(--text-secondary);
            display: block;
            font-size: 0.75rem;
        }
        .booking-detail .value {
            font-weight: 600;
        }
        .amount-match {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }
        .amount-match.match {
            background: rgba(0,184,148,0.15);
            color: var(--success);
        }
        .amount-match.mismatch {
            background: rgba(225,112,85,0.15);
            color: var(--danger);
        }
        .booking-actions {
            display: flex;
            gap: 10px;
        }
        .confirm-btn {
            flex: 1;
            padding: 10px;
            background: var(--gradient-2);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Inter';
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .reject-btn {
            flex: 1;
            padding: 10px;
            background: rgba(225,112,85,0.2);
            color: var(--danger);
            border: 1px solid rgba(225,112,85,0.3);
            border-radius: 10px;
            font-family: 'Inter';
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .confirm-btn:hover { transform: translateY(-2px); }
        .reject-btn:hover { transform: translateY(-2px); }
        .no-bookings {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .no-bookings i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }
        .refresh-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 auto 20px;
            padding: 10px 24px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text-primary);
            border-radius: 12px;
            font-family: 'Inter';
            font-weight: 600;
            cursor: pointer;
        }
        .refresh-btn:hover { background: rgba(255,255,255,0.12); }
        .stats-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .stat-box {
            padding: 15px 25px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-box .num {
            font-size: 1.8rem;
            font-weight: 800;
            display: block;
        }
        .stat-box .lbl {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .stat-box.pending-stat .num { color: var(--warning); }
        .stat-box.confirmed-stat .num { color: var(--success); }
        .stat-box.rejected-stat .num { color: var(--danger); }
        .screenshot-thumb {
            max-width: 150px;
            max-height: 100px;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .screenshot-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            cursor: pointer;
        }
        .screenshot-modal.active { display: flex; }
        .screenshot-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
        }
        @media(max-width:600px) {
            .booking-details { grid-template-columns: 1fr; }
            .booking-actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="bg-circle circle-1"></div>
        <div class="bg-circle circle-2"></div>
        <div class="bg-circle circle-3"></div>
    </div>

    <nav class="navbar glass-effect">
        <div class="nav-brand">
            <span>🏏</span>
            <span>CricTurf Admin</span>
        </div>
        <div class="nav-links">
            <a href="../index.html" class="nav-link">← Back to Site</a>
        </div>
    </nav>

    <!-- Login -->
    <div class="admin-login glass-effect" id="admin-login">
        <h2>🔐 Admin Login</h2>
        <div class="form-group">
            <label style="color:var(--text-secondary);font-size:0.85rem;margin-bottom:5px;display:block;">Password</label>
            <input type="password" id="admin-password" placeholder="Enter admin password">
        </div>
        <button class="login-btn" id="login-btn" style="margin-top:10px;">Login</button>
        <p style="text-align:center;color:var(--text-secondary);font-size:0.75rem;margin-top:12px;">Default: cricturf2024</p>
    </div>

    <!-- Admin Dashboard -->
    <div class="pending-bookings hidden" id="admin-dashboard">
        <div class="admin-header">
            <h1>🏏 Payment <span class="gradient-text">Verification</span></h1>
            <p>Check your Easypaisa/JazzCash and verify payments below</p>
        </div>

        <div class="stats-bar">
            <div class="stat-box pending-stat glass-effect-dark">
                <span class="num" id="stat-pending">0</span>
                <span class="lbl">Pending</span>
            </div>
            <div class="stat-box confirmed-stat glass-effect-dark">
                <span class="num" id="stat-confirmed">0</span>
                <span class="lbl">Confirmed</span>
            </div>
            <div class="stat-box rejected-stat glass-effect-dark">
                <span class="num" id="stat-rejected">0</span>
                <span class="lbl">Rejected</span>
            </div>
        </div>

        <button class="refresh-btn" id="refresh-btn">
            <i class="fas fa-sync-alt"></i> Refresh Bookings
        </button>

        <div id="bookings-list"></div>
    </div>

    <!-- Screenshot Modal -->
    <div class="screenshot-modal" id="screenshot-modal">
        <img id="modal-screenshot-img" src="" alt="Screenshot">
    </div>

    <script>
        // Admin password (change this!)
        const ADMIN_PASSWORD = 'cricturf2024';

        document.getElementById('login-btn').addEventListener('click', () => {
            const pwd = document.getElementById('admin-password').value;
            if (pwd === ADMIN_PASSWORD) {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadBookings();
            } else {
                alert('Wrong password!');
            }
        });

        document.getElementById('admin-password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('login-btn').click();
        });

        document.getElementById('refresh-btn').addEventListener('click', loadBookings);

        async function loadBookings() {
            const list = document.getElementById('bookings-list');
            list.innerHTML = '<div class="no-bookings"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>';

            try {
                const res = await fetch('/api/get-pending-bookings');
                const data = await res.json();

                if (!data.bookings || data.bookings.length === 0) {
                    list.innerHTML = '<div class="no-bookings"><i class="fas fa-inbox"></i><p>No pending bookings</p></div>';
                    document.getElementById('stat-pending').textContent = '0';
                    document.getElementById('stat-confirmed').textContent = data.confirmed || 0;
                    document.getElementById('stat-rejected').textContent = data.rejected || 0;
                    return;
                }

                let pending = 0, confirmed = 0, rejected = 0;
                let html = '';

                data.bookings.forEach(b => {
                    if (b.status === 'pending') pending++;
                    else if (b.status === 'confirmed') confirmed++;
                    else if (b.status === 'rejected') rejected++;

                    const amountMatch = parseInt(b.paidAmount) === parseInt(b.expectedAmount);
                    const statusClass = b.status || 'pending';

                    html += `
                    <div class="booking-card glass-effect ${statusClass}">
                        <div class="booking-header">
                            <span class="booking-id">${b.bookingId}</span>
                            <span class="booking-status ${statusClass}">${b.status ? b.status.toUpperCase() : 'PENDING'}</span>
                        </div>
                        <div class="booking-details">
                            <div class="booking-detail"><span class="label">Name</span><span class="value">${b.userDetails?.fullName || '-'}</span></div>
                            <div class="booking-detail"><span class="label">Phone</span><span class="value">${b.userDetails?.phone || '-'}</span></div>
                            <div class="booking-detail"><span class="label">Email</span><span class="value">${b.userDetails?.email || '-'}</span></div>
                            <div class="booking-detail"><span class="label">Date</span><span class="value">${b.date}</span></div>
                            <div class="booking-detail"><span class="label">Slot</span><span class="value">${b.time}</span></div>
                            <div class="booking-detail"><span class="label">Players</span><span class="value">${b.userDetails?.players || '-'}</span></div>
                            <div class="booking-detail"><span class="label">Payment</span><span class="value">${b.paymentMethod}</span></div>
                            <div class="booking-detail"><span class="label">TXN ID</span><span class="value">${b.transactionId}</span></div>
                            <div class="booking-detail"><span class="label">Sender</span><span class="value">${b.senderNumber}</span></div>
                            <div class="booking-detail"><span class="label">Submitted</span><span class="value">${new Date(b.submittedAt).toLocaleString()}</span></div>
                        </div>
                        <div class="amount-match ${amountMatch ? 'match' : 'mismatch'}">
                            ${amountMatch
                                ? `<i class="fas fa-check-circle"></i> Amount MATCH: Sent ₨${b.paidAmount} = Expected ₨${b.expectedAmount}`
                                : `<i class="fas fa-times-circle"></i> Amount MISMATCH: Sent ₨${b.paidAmount} ≠ Expected ₨${b.expectedAmount}`
                            }
                        </div>
                        ${b.screenshot ? `<img class="screenshot-thumb" src="${b.screenshot}" onclick="showScreenshot('${b.screenshot}')" alt="Screenshot">` : ''}
                        ${statusClass === 'pending' ? `
                        <div class="booking-actions">
                            <button class="confirm-btn" onclick="verifyBooking('${b.bookingId}','confirmed')">
                                <i class="fas fa-check"></i> Confirm Payment
                            </button>
                            <button class="reject-btn" onclick="verifyBooking('${b.bookingId}','rejected')">
                                <i class="fas fa-times"></i> Reject
                            </button>
                        </div>` : ''}
                    </div>`;
                });

                list.innerHTML = html;
                document.getElementById('stat-pending').textContent = pending;
                document.getElementById('stat-confirmed').textContent = confirmed;
                document.getElementById('stat-rejected').textContent = rejected;
            } catch (err) {
                list.innerHTML = `<div class="no-bookings"><i class="fas fa-exclamation-triangle"></i><p>Error loading bookings: ${err.message}</p></div>`;
            }
        }

        async function verifyBooking(bookingId, action) {
            if (!confirm(`Are you sure you want to ${action} booking ${bookingId}?`)) return;

            try {
                const res = await fetch('/api/verify-booking', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bookingId, action })
                });
                const data = await res.json();
                if (data.success) {
                    alert(`Booking ${action} successfully!`);
                    loadBookings();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        function showScreenshot(src) {
            document.getElementById('modal-screenshot-img').src = src;
            document.getElementById('screenshot-modal').classList.add('active');
        }

        document.getElementById('screenshot-modal').addEventListener('click', () => {
            document.getElementById('screenshot-modal').classList.remove('active');
        });

        // Auto refresh every 30 seconds
        setInterval(() => {
            if (!document.getElementById('admin-dashboard').classList.contains('hidden')) {
                loadBookings();
            }
        }, 30000);
    </script>
</body>
</html>
